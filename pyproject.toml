[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltw-splitter"
version = "2.4.0"
description = "Local-first YouTube automation studio: split long videos into platform-ready short-form clips."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Eli Dolney" }]
keywords = ["video", "youtube", "shorts", "tiktok", "automation", "whisper", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
ltw = "src.core.video_splitter:main"
ltw-gui = "launch_gui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "build", "dist", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line-length handled by black
    "B008",  # function default arg OK for our callables
]

[tool.ruff.lint.per-file-ignores]
"src/gui/**" = ["E402"]  # tkinter import ordering

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
